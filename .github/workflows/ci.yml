name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n zeroport.sh
      - name: ShellCheck
        run: shellcheck -x zeroport.sh tests/smoke.sh
      - name: Smoke tests
        run: bash tests/smoke.sh
